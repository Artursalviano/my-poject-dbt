version: 2

models:
  - name: dim_customers
    description: |
      A dimensional customer model that enriches customer master data with
      aggregated order history metrics.
      It combines customer profile information from the staging customer model
      with order activity from the orders fact model.
    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
      - name: first_name
        description: "Customer first name."
      - name: last_name
        description: "Customer last name."
      - name: first_order_date
        description: "Date when the customer placed their first order."
      - name: most_recent_order_date
        description: "Date when the customer placed their most recent order."
      - name: number_of_orders
        description: "Total number of orders placed by the customer."
      - name: lifetime_value
        description: "Total revenue value generated by the customer across all orders."
